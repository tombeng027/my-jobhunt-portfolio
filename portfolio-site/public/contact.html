<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>
  <link rel="stylesheet" href="./documentation.css" />
  <style>
    .button {
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      text-decoration: none;
    }
    .contact-form-container {
      max-width: 420px;
      margin: 40px auto;
      padding: 2rem;
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .contact-form-container h1 {
      margin-bottom: 1rem;
      color: var(--heading);
      font-size: 1.5rem;
    }
    .contact-form label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    .contact-form button {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: var(--accent, #007bff);
      color: var(--bg, #17181b);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .contact-form button:hover {
      background: var(--heading, #0056b3);
    }
    .contact-form button:focus-visible {
      outline: 2px solid var(--accent, #007bff);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div style="max-width:420px;margin:40px auto 0 auto;text-align:left;">
      <a href="./" class="button button-outline" style="margin-bottom:1.5rem;display:inline-block;padding:0.6rem 1.5rem;font-size:1rem;">← Back to Portfolio</a>
    </div>
    <div class="contact-form-container">
      <h1>Contact Me</h1>
      <form class="contact-form" action="https://formspree.io/f/mykbgwnr" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit">Send</button>
      </form>
      <p style="font-size:0.95rem;color:#888;margin-top:1rem;">This form is provided by Formspree. Information entered here is sent to Formspree for processing and delivery. Review the <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noreferrer">Formspree privacy policy</a> before submitting, and do not send sensitive information.</p>
      <p style="font-size:0.95rem;color:#888;margin-top:1rem;">You can also connect through <a href="https://www.linkedin.com/in/norbertbriones" target="_blank" rel="noreferrer">LinkedIn</a>.</p>
    </div>
  </main>
</body>
</html>
